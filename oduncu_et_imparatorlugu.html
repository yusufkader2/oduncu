  const b = state.bag;
  return b.wood + b.plank + b.furn + b.rawMeat + b.steak;
}

// --- UNIFIED COLLISION & FENCE SYSTEM ---
// Lumber Camp: x [-280, 280], y [-220, 220]

//   Right Gate (when restaurant unlocked): y [-60, 70] at x = 280

const FENCE_SEGMENTS = [
  // Lumber Camp Top Wall (split by gate [-65, 65])
  { x1: -280, y1: -220, x2: -65,  y2: -220 },
  { x1: 65,   y1: -220, x2: 280,  y2: -220 },

  { x1: 280,  y1: 70,   x2: 340,  y2: 70,   req: 'restaurant' },

  { x1: 670,  y1: -220, x2: 840,  y2: -220, req: 'restaurant' },
  // Restaurant Right & Bottom Walls
  { x1: 840,  y1: -220, x2: 840,  y2: 220,  req: 'restaurant' },
  { x1: 340,  y1: 220,  x2: 840,  y2: 220,  req: 'restaurant' },
  // Separator cliff between Forest and Hunting Mountain (x = 495, y [-880, -220])
  { x1: 495,  y1: -880, x2: 495,  y2: -220, req: 'restaurant' }
];

function circleSegmentResolve(ent, radius, x1, y1, x2, y2) {
  const dx = x2 - x1;
  const dy = y2 - y1;
  const lenSq = dx * dx + dy * dy;
  let t = 0;
  if (lenSq > 0) {
    t = Math.max(0, Math.min(1, ((ent.x - x1) * dx + (ent.y - y1) * dy) / lenSq));
  }
  const cx = x1 + t * dx;
  const cy = y1 + t * dy;
  const distX = ent.x - cx;
  const distY = ent.y - cy;
  const dist = Math.hypot(distX, distY);
  if (dist < radius && dist > 0.0001) {
    const push = radius - dist;
    ent.x += (distX / dist) * push;
    ent.y += (distY / dist) * push;
  }
}

function resolveEntityBounds(ent, radius = 15) {
  const minX = -530;
  const maxX = state.unlocks.restaurant ? 1190 : 460;
  const minY = state.unlocks.restaurant ? -870 : -830;
  const maxY = 205;

  ent.x = Math.max(minX, Math.min(maxX, ent.x));
  ent.y = Math.max(minY, Math.min(maxY, ent.y));

  for (const seg of FENCE_SEGMENTS) {
    if (seg.req && !state.unlocks[seg.req]) continue;
    if (seg.lockKey && state.unlocks[seg.lockKey]) continue;
    circleSegmentResolve(ent, radius, seg.x1, seg.y1, seg.x2, seg.y2);
  }
}

// Gate-aware path steering for workers so they NEVER jump over fences!
function moveWorkerTowards(w, tx, ty, speed, dt) {
  let goalX = tx, goalY = ty;

  // Check if worker is inside Lumber Camp (y > -220 && x < 310) and target is in Forest (y < -220)
  if (w.y > -215 && w.x < 310 && ty < -225) {
    if (Math.abs(w.x) > 42) {
      goalX = 0; goalY = -195; // Go to top gate interior
    } else {
      goalX = 0; goalY = -245; // Pass through top gate
    }
  }
  // Worker is in Forest (y < -220 && x < 495) and target is inside Lumber Camp (y > -220)
  else if (w.y < -225 && w.x < 495 && ty > -215) {
    if (Math.abs(w.x) > 42) {
      goalX = 0; goalY = -245; // Go to top gate exterior
    } else {
      goalX = 0; goalY = -195; // Enter top gate
    }
  }
  // Worker is inside Restaurant (x >= 340 && y > -220) and target is on Hunting Mountain (y < -220)
  else if (w.y > -215 && w.x >= 340 && ty < -225) {
    if (w.x < 550 || w.x > 650) {
      goalX = 600; goalY = -195;
    } else {
      goalX = 600; goalY = -245;
    }
  }
  // Worker is on Hunting Mountain (x >= 495 && y < -220) and target is inside Restaurant (y > -220)
  else if (w.y < -225 && w.x >= 495 && ty > -215) {
    if (w.x < 550 || w.x > 650) {
      goalX = 600; goalY = -245;
    } else {
      goalX = 600; goalY = -195;
    }
  }

  const dx = goalX - w.x;
  const dy = goalY - w.y;
  const dist = Math.hypot(dx, dy);
  if (dist > 2) {
    w.x += (dx / dist) * speed * dt;
    w.y += (dy / dist) * speed * dt;
    w.walk = (w.walk || 0) + dt * 9.5;
    if (Math.abs(dx) > 1) w.facing = dx > 0 ? 1 : -1;
  }
  resolveEntityBounds(w, 14);
}

// Dropped ground items
const groundItems = [];
function spawnGroundItem(x, y, item, amount = 1) {
  for (let i = 0; i < amount; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = 14 + Math.random() * 18;
    groundItems.push({
      x: x + Math.cos(a) * r,
      y: y + Math.sin(a) * r,
      item,
      bob: Math.random() * Math.PI * 2

  }
}

const animals = [];
function initAnimals() {

  const spots = [

    });

}

function spawnCustomer() {
  const stalls = ['wood'];
  if (state.unlocks.sawmill) stalls.push('plank');
  if (state.unlocks.workshop) stalls.push('furn');
  if (state.unlocks.restaurant) stalls.push('steak', 'steak');

  const item = stalls[Math.floor(Math.random() * stalls.length)];

  let targetX = -165;
  if (item === 'plank') targetX = 0;
  if (item === 'furn') targetX = 165;
  if (item === 'steak') targetX = 590;

  const colors = ['#3b82f6', '#8b5cf6', '#ec4899', '#10b981', '#f97316', '#06b6d4'];
  customers.push({
    item,
    want: 1 + Math.floor(Math.random() * 3),
    x: targetX + (Math.random() * 140 - 70),
    y: 440,
    targetX,
    state: 'arriving',
    color: colors[Math.floor(Math.random() * colors.length)],
    walk: 0
  });
}

const floaters = [];
const particles = [];
function addFloater(x, y, text, color = '#fde047') {
  floaters.push({ x, y, text, color, life: 1.0 });
}
function addParticles(x, y, color, count = 6) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 45 + Math.random() * 90;
    particles.push({
      x, y,

      life: 0.45 + Math.random() * 0.25,

    });

}

const joy = { active: false, startX: 0, startY: 0, curX: 0, curY: 0, dx: 0, dy: 0 };
const keys = {};
window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

let pointerDownTime = 0;
let pointerDownPos = { x: 0, y: 0 };

canvas.addEventListener('pointerdown', e => {
  if (document.getElementById('modalOverlay').classList.contains('open')) return;
  pointerDownTime = performance.now();
  pointerDownPos = { x: e.clientX, y: e.clientY };
  joy.active = true;
  joy.startX = e.clientX;
  joy.startY = e.clientY;
  joy.curX = e.clientX;
  joy.curY = e.clientY;
  joy.dx = 0;
  joy.dy = 0;
});

window.addEventListener('pointermove', e => {
  if (!joy.active) return;
  joy.curX = e.clientX;
  joy.curY = e.clientY;
  const rx = joy.curX - joy.startX;
  const ry = joy.curY - joy.startY;
  const dist = Math.hypot(rx, ry);
  const maxR = 52;
  if (dist > 4) {
    const clamp = Math.min(dist, maxR) / maxR;
    joy.dx = (rx / dist) * clamp;
    joy.dy = (ry / dist) * clamp;
  } else {
    joy.dx = 0;
    joy.dy = 0;
  }
});

window.addEventListener('pointerup', e => {
  if (joy.active) {
    const dt = performance.now() - pointerDownTime;
    const moved = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
    if (dt < 260 && moved < 14) {
      const pScreenX = W / 2 + (player.x - cam.x);
      const pScreenY = H / 2 + (player.y - cam.y);
      if (Math.hypot(e.clientX - pScreenX, e.clientY - pScreenY) < 46) {
        openModal();
      }
    }
  }
  joy.active = false;
  joy.dx = 0;
  joy.dy = 0;
});

// --- UPDATE LOOP ---
let padTimer = 0;
let lastTime = performance.now();

function update(dt) {
  let ix = joy.dx;
  let iy = joy.dy;
  if (keys['w'] || keys['arrowup']) iy -= 1;
  if (keys['s'] || keys['arrowdown']) iy += 1;
  if (keys['a'] || keys['arrowleft']) ix -= 1;
  if (keys['d'] || keys['arrowright']) ix += 1;

  const mag = Math.hypot(ix, iy);
  if (mag > 1) { ix /= mag; iy /= mag; }

  if (mag > 0.05) {
    const spd = getMoveSpeed();
    player.x += ix * spd * dt;
    player.y += iy * spd * dt;
    resolveEntityBounds(player, 15);
    if (Math.abs(ix) > 0.08) player.facing = ix > 0 ? 1 : -1;
    player.walkAnim += dt * 11;
  } else {
    player.walkAnim = 0;
  }

  // Smooth Camera Lerp
  const camLerp = 1 - Math.exp(-10 * dt);
  cam.x += (player.x - cam.x) * camLerp;
  cam.y += (player.y - cam.y) * camLerp;

  // Pickup ground items whenever bag has space
  for (let i = groundItems.length - 1; i >= 0; i--) {
    const gi = groundItems[i];
    gi.bob += dt * 5;
    if (getTotalBag() < getMaxBag() && Math.hypot(player.x - gi.x, player.y - gi.y) < 48) {
      state.bag[gi.item]++;
      const iconMap = { wood: '🪵', plank: '🪚', furn: '🪑', rawMeat: '🥩', steak: '🍖' };
      addFloater(gi.x, gi.y - 16, `+1 ${iconMap[gi.item]}`, '#fef08a');
      groundItems.splice(i, 1);
    }
  }

  // Passive HP regen inside camps
  if (player.y > -210 && player.hp < getPlayerMaxHp()) {
    player.hp = Math.min(getPlayerMaxHp(), player.hp + 12 * dt);
  }
  if (player.hurtTimer > 0) player.hurtTimer -= dt;
  if (player.hitCooldown > 0) player.hitCooldown -= dt;
  if (player.swingAnim > 0) player.swingAnim = Math.max(0, player.swingAnim - dt * 4.5);

  // Auto-chop nearby trees
  let choppedOrAttacked = false;
  if (player.hitCooldown <= 0) {
    for (const t of trees) {
      if (t.respawn > 0) continue;
      if (t.gold && !state.unlocks.goldForest) continue;
      if (Math.hypot(player.x - t.x, player.y - t.y) < 56) {
        player.hitCooldown = 0.35;
        player.swingAnim = 1;
        player.facing = t.x >= player.x ? 1 : -1;
        t.shake = 0.25;
        t.hp -= getAttackPower();
        addParticles(t.x, t.y - 18, t.gold ? '#fbbf24' : '#a16207', 5);
        if (t.hp <= 0) {
          t.respawn = t.gold ? 8 : 5.5;
          const totalYield = t.gold ? 3 : 1;
          const space = Math.max(0, getMaxBag() - getTotalBag());
          const inBag = Math.min(totalYield, space);
          const onGround = totalYield - inBag;

          if (inBag > 0) {
            state.bag.wood += inBag;
            addFloater(t.x, t.y - 30, `+${inBag} 🪵`, '#fef08a');
          }
          if (onGround > 0) {
            spawnGroundItem(t.x, t.y + 10, 'wood', onGround);
            if (inBag === 0) addFloater(t.x, t.y - 30, '🎒 Dolu!', '#fb923c');
          }
        }
        choppedOrAttacked = true;
        break;
      }
    }
  }

  // Auto-attack nearby animals
  if (!choppedOrAttacked && state.unlocks.restaurant && player.hitCooldown <= 0) {
    for (const a of animals) {
      if (a.respawn > 0) continue;
      if (Math.hypot(player.x - a.x, player.y - a.y) < 56) {
        player.hitCooldown = 0.38;
        player.swingAnim = 1;
        player.facing = a.x >= player.x ? 1 : -1;
        a.shake = 0.25;
        a.hp -= getAttackPower() * 1.25;
        addParticles(a.x, a.y - 10, '#ef4444', 6);
        if (a.hp <= 0) {
          a.respawn = 9;
          const space = Math.max(0, getMaxBag() - getTotalBag());
          const inBag = Math.min(a.meat, space);
          const onGround = a.meat - inBag;
          if (inBag > 0) {
            state.bag.rawMeat += inBag;
            addFloater(a.x, a.y - 25, `+${inBag} 🥩`, '#fca5a5');
          }
          if (onGround > 0) {
            spawnGroundItem(a.x, a.y + 10, 'rawMeat', onGround);
          }
        }
        break;
      }
    }
  }

  // Trees respawn & shake
  for (const t of trees) {
    if (t.shake > 0) t.shake = Math.max(0, t.shake - dt);
    if (t.respawn > 0) {
      t.respawn -= dt;
      if (t.respawn <= 0) t.hp = t.maxHp;
    }
  }

  // Animals AI
  if (state.unlocks.restaurant) {
    for (const a of animals) {
      if (a.shake > 0) a.shake = Math.max(0, a.shake - dt);
      if (a.respawn > 0) {
        a.respawn -= dt;
        if (a.respawn <= 0) {
          a.hp = a.maxHp;
          a.x = a.homeX;
          a.y = a.homeY;
        }
        continue;
      }
      const distP = Math.hypot(player.x - a.x, player.y - a.y);
      if (a.aggro && distP < 210 && player.y < -235 && player.x > 500) {
        const ang = Math.atan2(player.y - a.y, player.x - a.x);
        if (distP > 36) {
          a.x += Math.cos(ang) * a.speed * dt;
          a.y += Math.sin(ang) * a.speed * dt;
        } else {
          a.atkTimer -= dt;
          if (a.atkTimer <= 0) {
            a.atkTimer = 1.05;
            player.hp -= a.dmg;
            player.hurtTimer = 0.25;
            addFloater(player.x, player.y - 34, `-${a.dmg} ❤️`, '#ef4444');
            if (player.hp <= 0) {
              player.hp = getPlayerMaxHp();
              player.x = 0;
              player.y = 40;
              state.bag.rawMeat = Math.floor(state.bag.rawMeat / 2);
              addFloater(0, 0, '💫 Kampa Döndün', '#f87171');
            }
          }
        }
      } else if (!a.aggro && distP < 150) {
        const ang = Math.atan2(a.y - player.y, a.x - player.x);
        a.x += Math.cos(ang) * a.speed * dt;
        a.y += Math.sin(ang) * a.speed * dt;
      } else {
        a.wanderTimer -= dt;
        if (a.wanderTimer <= 0) {
          a.wanderTimer = 1.5 + Math.random() * 2;
          a.wanderAngle = Math.atan2(a.homeY - a.y, a.homeX - a.x) + (Math.random() - 0.5) * 2.2;
        }
        a.x += Math.cos(a.wanderAngle) * 32 * dt;
        a.y += Math.sin(a.wanderAngle) * 32 * dt;
      }
      // Keep animals inside mountain bounds
      a.x = Math.max(525, Math.min(1170, a.x));
      a.y = Math.max(-850, Math.min(-255, a.y));
    }
  }

  // Pad interactions
  padTimer += dt;
  if (padTimer >= 0.14) {
    padTimer = 0;
    const cLim = getCounterLimit();
    for (const key in PADS) {
      const p = PADS[key];
      if (p.req && !state.unlocks[p.req]) continue;
      if (p.type === 'unlock' && state.unlocks[p.key]) continue;
      if (p.machine === 'sawmill' && !state.unlocks.sawmill) continue;
      if (p.machine === 'workshop' && !state.unlocks.workshop) continue;
      if (p.machine === 'grill' && !state.unlocks.restaurant) continue;

      if (Math.hypot(player.x - p.x, player.y - p.y) <= p.r + 12) {
        if (p.type === 'unlock') {
          if (state.money >= p.cost) {
            state.money -= p.cost;
            state.unlocks[p.key] = true;
            addParticles(p.x, p.y, '#fbbf24', 18);
            addFloater(p.x, p.y - 25, '✨ AÇILDI!', '#fde047');
          }
        } else if (p.type === 'trash') {
          if (getTotalBag() > 0) {
            state.bag = { wood: 0, plank: 0, furn: 0, rawMeat: 0, steak: 0 };
            addParticles(p.x, p.y, '#94a3b8', 12);
            addFloater(p.x, p.y - 22, '🗑️ Çanta Boşaltıldı', '#cbd5e1');
          }
        } else if (p.type === 'in') {
          const m = machines[p.machine];
          if (p.machine === 'sawmill' && state.bag.wood > 0 && m.input < 12) {
            state.bag.wood--; m.input++;
          } else if (p.machine === 'workshop' && state.bag.plank > 0 && m.input < 10) {
            state.bag.plank--; m.input++;
          } else if (p.machine === 'grill' && state.bag.rawMeat > 0 && m.input < 10) {
            state.bag.rawMeat--; m.input++;
          }
        } else if (p.type === 'out') {
          const m = machines[p.machine];
          if (m.output > 0 && getTotalBag() < getMaxBag()) {
            m.output--;
            if (p.machine === 'sawmill') state.bag.plank++;
            if (p.machine === 'workshop') state.bag.furn++;
            if (p.machine === 'grill') state.bag.steak++;
          }
        } else if (p.type === 'sell') {
          if (state.bag[p.item] > 0 && state.counters[p.item] < cLim) {
            state.bag[p.item]--;
            state.counters[p.item]++;
          }
          processSale(p.item, p.price, p.x, p.y, true);
        }
      }
    }
  }

  // Machines processing
  ['sawmill', 'workshop', 'grill'].forEach(k => {
    const m = machines[k];
    if (m.input > 0 && m.output < 12) {
      m.progress += dt;
      if (m.progress >= m.duration) {
        m.progress = 0;
        m.input--;
        m.output++;
      }
    } else {
      m.progress = 0;
    }
  });

  // Customers logic
  custSpawnTimer -= dt;
  if (custSpawnTimer <= 0) {
    custSpawnTimer = 2.4;
    spawnCustomer();
  }
  for (let i = customers.length - 1; i >= 0; i--) {
    const c = customers[i];
    const sameQueue = customers.filter(o => o.item === c.item && o.state !== 'leaving');
    const idx = sameQueue.indexOf(c);
    const goalY = 250 + idx * 46;

    if (c.state === 'arriving' || c.state === 'waiting') {
      const dx = c.targetX - c.x;
      const dy = goalY - c.y;
      const d = Math.hypot(dx, dy);
      if (d > 4) {
        c.x += (dx / d) * 115 * dt;
        c.y += (dy / d) * 115 * dt;
        c.walk += dt * 8;
        c.state = 'arriving';
      } else {
        c.walk = 0;
        c.state = 'waiting';
      }
    } else if (c.state === 'leaving') {
      c.y += 145 * dt;
      c.walk += dt * 9;
      if (c.y > 470) customers.splice(i, 1);
    }
  }

  // Workers AI (Gate-aware + Balanced Sawmill/Wood Shelf priority)
  const cLim = getCounterLimit();
  workers.forEach(w => {
    if (w.role === 'lumberjack') {
      if (w.swing > 0) w.swing = Math.max(0, w.swing - dt * 4);
      if (w.bag < w.cap) {
        let best = null, bd = 9999;
        for (const t of trees) {
          if (t.respawn > 0 || (t.gold && !state.unlocks.goldForest)) continue;
          const d = Math.hypot(w.x - t.x, w.y - t.y);
          if (d < bd) { bd = d; best = t; }
        }
        if (best) {
          if (bd > 44) {
            moveWorkerTowards(w, best.x, best.y, 130, dt);
          } else {
            w.walk = 0;
            if (w.swing <= 0) {
              w.swing = 1;
              w.facing = best.x >= w.x ? 1 : -1;
              best.hp -= 1.2;
              best.shake = 0.2;
              if (best.hp <= 0) {
                best.respawn = best.gold ? 8 : 5.5;
                w.bag += best.gold ? 2 : 1;
              }
            }
          }
        }
      } else {
        // Smart Priority:
        // 1. If Sawmill unlocked and has < 6 wood, fill Sawmill up to 6.
        // 2. Otherwise if Wood Counter Shelf has room (< cLim), deliver directly to Wood Counter Shelf!
        // 3. Otherwise top up Sawmill up to 12.
        let tx = PADS.sellWood.x, ty = PADS.sellWood.y - 20, destType = 'woodCounter';
        if (state.unlocks.sawmill && machines.sawmill.input < 6) {
          tx = PADS.sawmillIn.x; ty = PADS.sawmillIn.y; destType = 'sawmill';
        } else if (state.counters.wood < cLim) {
          tx = PADS.sellWood.x; ty = PADS.sellWood.y - 20; destType = 'woodCounter';
        } else if (state.unlocks.sawmill && machines.sawmill.input < 12) {
          tx = PADS.sawmillIn.x; ty = PADS.sawmillIn.y; destType = 'sawmill';
        }

        const d = Math.hypot(tx - w.x, ty - w.y);
        if (d > 24) {
          moveWorkerTowards(w, tx, ty, 138, dt);
        } else {
          w.walk = 0;
          if (destType === 'sawmill') {
            const put = Math.min(w.bag, 12 - machines.sawmill.input);
            machines.sawmill.input += put;
            w.bag -= put;
          } else if (state.counters.wood < cLim) {
            const put = Math.min(w.bag, cLim - state.counters.wood);
            state.counters.wood += put;
            w.bag -= put;
          }
        }
      }
    } else if (w.role === 'carrier') {
      if (!w.carryItem || w.carryAmt <= 0) {
        w.carryItem = null;
        w.carryAmt = 0;
        let targetPad = null, pickType = null;
        if (state.unlocks.workshop && machines.workshop.output > 0 && state.counters.furn < cLim) {
          targetPad = PADS.workOut; pickType = 'furn';
        } else if (state.unlocks.sawmill && machines.sawmill.output > 0) {
          if (state.unlocks.workshop && machines.workshop.input < 6 && state.counters.plank >= Math.min(3, cLim)) {
            targetPad = PADS.sawmillOut; pickType = 'plank_to_work';
          } else if (state.counters.plank < cLim) {
            targetPad = PADS.sawmillOut; pickType = 'plank';
          } else if (state.unlocks.workshop && machines.workshop.input < 10) {
            targetPad = PADS.sawmillOut; pickType = 'plank_to_work';
          }
        } else if (state.unlocks.restaurant && machines.grill.output > 0 && state.counters.steak < cLim) {
          targetPad = PADS.grillOut; pickType = 'steak';
        }

        if (targetPad) {
          const d = Math.hypot(targetPad.x - w.x, targetPad.y - w.y);
          if (d > 22) {
            moveWorkerTowards(w, targetPad.x, targetPad.y, 148, dt);
          } else {
            w.walk = 0;
            const mKey = targetPad.machine;
            const take = Math.min(w.cap, machines[mKey].output);
            if (take > 0) {
              machines[mKey].output -= take;
              w.carryItem = pickType;
              w.carryAmt = take;
            }
          }
        } else {
          w.walk = 0;
        }
      } else {
        let destX = PADS.sellPlank.x, destY = PADS.sellPlank.y - 20;
        if (w.carryItem === 'furn') { destX = PADS.sellFurn.x; destY = PADS.sellFurn.y - 20; }
        else if (w.carryItem === 'plank_to_work') { destX = PADS.workIn.x; destY = PADS.workIn.y; }
        else if (w.carryItem === 'steak') { destX = PADS.sellSteak.x; destY = PADS.sellSteak.y - 20; }

        const d = Math.hypot(destX - w.x, destY - w.y);
        if (d > 22) {
          moveWorkerTowards(w, destX, destY, 148, dt);
        } else {
          w.walk = 0;
          if (w.carryItem === 'plank_to_work') {
            machines.workshop.input += w.carryAmt;
            w.carryAmt = 0;
            w.carryItem = null;
          } else {
            const key = w.carryItem;
            const space = Math.max(0, cLim - state.counters[key]);
            const put = Math.min(w.carryAmt, space);
            state.counters[key] += put;
            w.carryAmt -= put;
            if (w.carryAmt <= 0) w.carryItem = null;
          }
        }
      }
    } else if (w.role === 'cashier') {
      w.timer += dt;
      if (w.timer >= 0.42) {
        w.timer = 0;
        if (w.x < -80) processSale('wood', 10, w.x, w.y, false);
        else if (w.x < 80 && state.unlocks.sawmill) processSale('plank', 32, w.x, w.y, false);
        else if (state.unlocks.workshop) processSale('furn', 95, w.x, w.y, false);
      }
    } else if (w.role === 'hunter' && state.unlocks.restaurant) {
      if (w.swing > 0) w.swing = Math.max(0, w.swing - dt * 4);
      if (w.bag < w.cap) {
        let best = null, bd = 9999;
        for (const a of animals) {
          if (a.respawn > 0) continue;
          const d = Math.hypot(w.x - a.x, w.y - a.y);
          if (d < bd) { bd = d; best = a; }
        }
        if (best) {
          if (bd > 44) {
            moveWorkerTowards(w, best.x, best.y, 138, dt);
          } else {
            w.walk = 0;
            if (w.swing <= 0) {
              w.swing = 1;
              w.facing = best.x >= w.x ? 1 : -1;
              best.hp -= 2.5;
              best.shake = 0.2;
              if (best.hp <= 0) {
                best.respawn = 9;
                w.bag += best.meat;
              }
            }
          }
        }
      } else {
        const tx = PADS.grillIn.x, ty = PADS.grillIn.y;
        const d = Math.hypot(tx - w.x, ty - w.y);
        if (d > 24) {
          moveWorkerTowards(w, tx, ty, 145, dt);
        } else {
          w.walk = 0;
          machines.grill.input += w.bag;
          w.bag = 0;
        }
      }
    } else if (w.role === 'waiter' && state.unlocks.restaurant) {
      w.timer += dt;
      if (w.timer >= 0.42) {
        w.timer = 0;
        processSale('steak', 145, w.x, w.y, false);
      }
    }
  });

  // Floaters & Particles
  for (let i = floaters.length - 1; i >= 0; i--) {
    floaters[i].y -= 36 * dt;
    floaters[i].life -= dt * 1.1;
    if (floaters[i].life <= 0) floaters.splice(i, 1);
  }
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 180 * dt;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }

  updateHUD();
}

function processSale(item, price, px, py, allowFromPlayerBag) {
  const cust = customers.find(c => c.item === item && c.state === 'waiting' && c.want > 0);
  if (!cust) return;

  if (state.counters[item] > 0) {
    state.counters[item]--;
  } else if (allowFromPlayerBag && state.bag[item] > 0) {
    state.bag[item]--;
  } else {
    return;
  }

  cust.want--;
  state.money += price;
  addFloater(px, py - 24, `+${price} ₺`, '#4ade80');
  if (cust.want <= 0) {
    cust.state = 'leaving';
  }
}

// --- RENDERING ---
function drawOutlinedText(text, x, y, size = 14, color = '#fff') {
  ctx.font = `800 ${size}px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineWidth = 4;
  ctx.strokeStyle = 'rgba(0,0,0,0.8)';
  ctx.strokeText(text, x, y);
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
}

function drawFences() {
  ctx.strokeStyle = '#78350f';
  ctx.lineWidth = 7;
  ctx.lineCap = 'round';
  const step = 32;

  for (const seg of FENCE_SEGMENTS) {
    if (seg.req && !state.unlocks[seg.req]) continue;
    if (seg.lockKey && state.unlocks[seg.lockKey]) continue;

    ctx.beginPath();
    ctx.moveTo(seg.x1, seg.y1);
    ctx.lineTo(seg.x2, seg.y2);
    ctx.stroke();

    const len = Math.hypot(seg.x2 - seg.x1, seg.y2 - seg.y1);
    const steps = Math.max(1, Math.round(len / step));
    for (let i = 0; i <= steps; i++) {
      const px = seg.x1 + (seg.x2 - seg.x1) * (i / steps);
      const py = seg.y1 + (seg.y2 - seg.y1) * (i / steps);
      drawFencePost(px, py);
    }
  }
}

function drawFencePost(x, y) {
  ctx.fillStyle = '#b45309';
  ctx.beginPath();
  ctx.arc(x, y, 5.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#451a03';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.strokeStyle = '#78350f';
  ctx.lineWidth = 7;
}

function drawCounterShelf(x, y, item, count, maxCount) {
  ctx.save();
  ctx.translate(x, y);

  ctx.fillStyle = '#5c2d16';
  ctx.strokeStyle = '#fbbf24';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.roundRect(-28, -14, 56, 26, 7);
  ctx.fill();
  ctx.stroke();

  const show = Math.min(count, 10);
  for (let i = 0; i < show; i++) {
    const col = i % 5;
    const row = Math.floor(i / 5);
    ctx.fillStyle = item === 'wood' ? '#b45309' : item === 'plank' ? '#f59e0b' : item === 'furn' ? '#d97706' : '#dc2626';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.roundRect(-22 + col * 9, -8 - row * 6, 7, 12, 2);
    ctx.fill();
    ctx.stroke();
  }

  drawOutlinedText(`${count}/${maxCount}`, 0, -24, 12, count >= maxCount ? '#f87171' : '#fde047');
  ctx.restore();
}

function drawPad(p) {
  if (p.req && !state.unlocks[p.req]) return;
  if (p.type === 'unlock' && state.unlocks[p.key]) return;
  if (p.machine === 'sawmill' && !state.unlocks.sawmill) return;
  if (p.machine === 'workshop' && !state.unlocks.workshop) return;
  if (p.machine === 'grill' && !state.unlocks.restaurant) return;

  const dist = Math.hypot(player.x - p.x, player.y - p.y);
  const active = dist <= p.r + 12;

  ctx.save();
  ctx.translate(p.x, p.y);

  ctx.beginPath();
  ctx.arc(0, 0, p.r, 0, Math.PI * 2);
  if (p.type === 'unlock') {
    ctx.fillStyle = active ? 'rgba(250, 204, 21, 0.34)' : 'rgba(250, 204, 21, 0.16)';
    ctx.strokeStyle = '#facc15';
  } else if (p.type === 'sell') {
    ctx.fillStyle = active ? 'rgba(34, 197, 94, 0.32)' : 'rgba(34, 197, 94, 0.16)';
    ctx.strokeStyle = '#4ade80';
  } else if (p.type === 'trash') {
    ctx.fillStyle = active ? 'rgba(239, 68, 68, 0.35)' : 'rgba(239, 68, 68, 0.16)';
    ctx.strokeStyle = '#f87171';
  } else {
    ctx.fillStyle = active ? 'rgba(255, 255, 255, 0.25)' : 'rgba(255, 255, 255, 0.12)';
    ctx.strokeStyle = 'rgba(255,255,255,0.65)';
  }
  ctx.lineWidth = active ? 3.5 : 2.5;
  ctx.fill();
  ctx.stroke();

  ctx.font = '21px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(p.icon, 0, p.type === 'trash' ? 0 : -6);

  if (p.type === 'unlock') {
    drawOutlinedText(`${p.cost} ₺`, 0, 15, 12, '#fde047');
  } else if (p.type === 'sell') {
    drawOutlinedText(`${p.price} ₺`, 0, 15, 12, '#86efac');
  } else if (p.type === 'in') {
    const cnt = machines[p.machine].input;
    drawOutlinedText(`${cnt}`, 0, 15, 13, '#fff');
  } else if (p.type === 'out') {
    const cnt = machines[p.machine].output;
    drawOutlinedText(`${cnt}`, 0, 15, 13, '#fde047');
  }

  ctx.restore();
}

function drawMachine(x, y, icon, machineKey) {
  if (machineKey === 'sawmill' && !state.unlocks.sawmill) return;
  if (machineKey === 'workshop' && !state.unlocks.workshop) return;
  if (machineKey === 'grill' && !state.unlocks.restaurant) return;

  const m = machines[machineKey];
  ctx.save();
  ctx.translate(x, y);

  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.roundRect(-26, -20, 52, 44, 12);
  ctx.fill();

  ctx.fillStyle = machineKey === 'grill' ? '#334155' : '#92400e';
  ctx.strokeStyle = '#f8fafc';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.roundRect(-24, -24, 48, 44, 12);
  ctx.fill();
  ctx.stroke();

  ctx.font = '24px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(icon, 0, -2);

  if (m.input > 0) {
    const pct = m.progress / m.duration;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(-20, -34, 40, 6);
    ctx.fillStyle = '#22c55e';
    ctx.fillRect(-20, -34, 40 * pct, 6);
  }

  ctx.restore();
}

function drawTree(t) {
  if (t.gold && !state.unlocks.goldForest) return;
  ctx.save();
  const sx = t.shake > 0 ? Math.sin(t.shake * 55) * 4 : 0;
  ctx.translate(t.x + sx, t.y);

  if (t.respawn > 0) {
    ctx.fillStyle = t.gold ? '#b45309' : '#78350f';
    ctx.beginPath();
    ctx.ellipse(0, 4, 11, 7, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    return;
  }

  ctx.scale(t.scale, t.scale);

  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath();
  ctx.ellipse(4, 12, 24, 12, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#5c2d16';
  ctx.fillRect(-6, -12, 12, 22);

  const c1 = t.gold ? '#d97706' : '#15803d';
  const c2 = t.gold ? '#f59e0b' : '#16a34a';
  const c3 = t.gold ? '#fde047' : '#22c55e';

  ctx.fillStyle = c1;
  ctx.beginPath(); ctx.arc(0, -20, 26, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = c2;
  ctx.beginPath(); ctx.arc(-6, -28, 20, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = c3;
  ctx.beginPath(); ctx.arc(6, -32, 17, 0, Math.PI * 2); ctx.fill();

  if (t.hp < t.maxHp) {
    const pct = Math.max(0, t.hp / t.maxHp);
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(-18, -62, 36, 5);
    ctx.fillStyle = '#fde047';
    ctx.fillRect(-18, -62, 36 * pct, 5);
  }

  ctx.restore();
}

function drawAnimal(a) {
  if (!state.unlocks.restaurant || a.respawn > 0) return;
  ctx.save();
  const sx = a.shake > 0 ? Math.sin(a.shake * 55) * 4 : 0;
  ctx.translate(a.x + sx, a.y);

  ctx.fillStyle = 'rgba(0,0,0,0.28)';
  ctx.beginPath();
  ctx.ellipse(0, 12, 18, 8, 0, 0, Math.PI * 2);
  ctx.fill();

  if (a.aggro) {
    ctx.strokeStyle = 'rgba(239, 68, 68, 0.45)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, 22, 0, Math.PI * 2);
    ctx.stroke();
  }

  ctx.font = '30px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(a.icon, 0, -2);

  if (a.hp < a.maxHp) {
    const pct = Math.max(0, a.hp / a.maxHp);
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    ctx.fillRect(-18, -26, 36, 5);
    ctx.fillStyle = a.aggro ? '#ef4444' : '#22c55e';
    ctx.fillRect(-18, -26, 36 * pct, 5);
  }
  ctx.restore();
}

function drawCharacter(x, y, shirtColor, hat, axeStyle, walkAnim, swingAnim, facing = 1, bagItems = []) {
  ctx.save();
  ctx.translate(x, y);

  const bob = Math.abs(Math.sin(walkAnim)) * 4;
  const tilt = Math.sin(walkAnim) * 0.06;

  // Ground shadow
  ctx.fillStyle = 'rgba(0,0,0,0.32)';
  ctx.beginPath();
  ctx.ellipse(0, 14, 15, 7, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.save();
  ctx.rotate(tilt);

  // Legs
  const legOff = Math.sin(walkAnim) * 5.5;
  ctx.fillStyle = '#1e293b';
  ctx.beginPath(); ctx.roundRect(-8, 2 + legOff * 0.45, 6, 12, 3); ctx.fill();
  ctx.beginPath(); ctx.roundRect(2, 2 - legOff * 0.45, 6, 12, 3); ctx.fill();

  // Backpack stack (behind character based on facing)
  if (bagItems.length > 0) {
    const show = Math.min(bagItems.length, 8);
    const bx = facing === 1 ? -17 : 7;
    for (let i = 0; i < show; i++) {
      const it = bagItems[i];
      ctx.fillStyle = it === 'wood' ? '#92400e' : it === 'plank' ? '#f59e0b' : it === 'furn' ? '#d97706' : it === 'rawMeat' ? '#ef4444' : '#7f1d1d';
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.roundRect(bx, -14 - i * 4.5 - bob, 10, 4.5, 2);
      ctx.fill();
      ctx.stroke();
    }
  }

  // Torso
  ctx.fillStyle = shirtColor;
  ctx.strokeStyle = '#0f172a';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.roundRect(-12, -14 - bob, 24, 20, 7);
  ctx.fill();
  ctx.stroke();

  // Head
  ctx.fillStyle = '#fed7aa';
  ctx.beginPath();
  ctx.arc(0, -23 - bob, 10, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  // Eyes (looking in facing direction)
  ctx.fillStyle = '#0f172a';
  const eyeX = facing === 1 ? 4 : -4;
  ctx.beginPath(); ctx.arc(eyeX, -24 - bob, 1.5, 0, Math.PI * 2); ctx.fill();

  // Hat
  if (hat === 'beanie') {
    ctx.fillStyle = '#f59e0b';
    ctx.beginPath(); ctx.arc(0, -26 - bob, 10.5, Math.PI, 0); ctx.fill();
  } else if (hat === 'cowboy') {
    ctx.fillStyle = '#78350f';
    ctx.beginPath(); ctx.ellipse(0, -30 - bob, 16, 4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillRect(-8, -37 - bob, 16, 8);
  } else if (hat === 'crown') {
    ctx.font = '16px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('👑', 0, -36 - bob);
  }

  // Axe in hand
  if (axeStyle !== 'none') {
    ctx.save();
    ctx.translate(facing * 13, -8 - bob);
    ctx.scale(facing, 1);
    const swingAngle = swingAnim > 0 ? Math.sin(swingAnim * Math.PI) * 1.65 : 0.22;
    ctx.rotate(swingAngle);
    ctx.fillStyle = '#78350f';
    ctx.fillRect(-2, -16, 4, 20);
    ctx.fillStyle = axeStyle === 'gold' ? '#facc15' : axeStyle === 'laser' ? '#38bdf8' : '#cbd5e1';
    ctx.beginPath();
    ctx.moveTo(0, -16);
    ctx.lineTo(10, -19);
    ctx.lineTo(10, -10);
    ctx.lineTo(0, -12);
    ctx.fill();
    ctx.restore();
  }

  ctx.restore();
  ctx.restore();
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  ctx.save();
  ctx.translate(W / 2 - cam.x, H / 2 - cam.y);

  // --- GROUND BIOMES ---
  ctx.fillStyle = '#2d4a2b';
  ctx.fillRect(-700, -1000, 2100, 1650);

  if (state.unlocks.goldForest) {
    ctx.fillStyle = '#3f4726';
    ctx.beginPath();
    ctx.roundRect(165, -830, 325, 580, 28);
    ctx.fill();
  }

  if (state.unlocks.restaurant) {
    // Mountain Hunting Ground (x: [500, 1210], y: [-890, -220])
    ctx.fillStyle = '#475569';
    ctx.beginPath();
    ctx.roundRect(500, -890, 710, 670, 32);
    ctx.fill();
    ctx.fillStyle = '#334155';
    ctx.beginPath(); ctx.arc(650, -450, 45, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(960, -640, 60, 0, Math.PI * 2); ctx.fill();
  }

  // Customer Street (Bottom)
  ctx.fillStyle = '#334155';
  ctx.fillRect(-700, 225, 2100, 320);
  ctx.fillStyle = '#64748b';
  ctx.fillRect(-700, 220, 2100, 18);

  // Lumber Camp Floor
  ctx.fillStyle = '#78553a';
  ctx.beginPath();
  ctx.roundRect(-280, -220, 560, 440, 18);
  ctx.fill();

  // Connecting Bridge Floor & Restaurant Floor
  if (state.unlocks.restaurant) {
    ctx.fillStyle = '#6b4c35';
    ctx.fillRect(275, -60, 70, 130);

    ctx.fillStyle = '#5c4033';
    ctx.beginPath();
    ctx.roundRect(340, -220, 500, 440, 18);
    ctx.fill();

    // Stone path from Restaurant Top Gate (x [530, 670]) into Mountain
    ctx.fillStyle = '#64748b';
    ctx.fillRect(535, -245, 130, 45);
  }

  // --- FENCES ---
  drawFences();

  // --- PADS, SHELVES & MACHINES ---
  for (const k in PADS) drawPad(PADS[k]);

  const cLim = getCounterLimit();
  drawCounterShelf(-165, 204, 'wood', state.counters.wood, cLim);
  if (state.unlocks.sawmill) drawCounterShelf(0, 204, 'plank', state.counters.plank, cLim);
  if (state.unlocks.workshop) drawCounterShelf(165, 204, 'furn', state.counters.furn, cLim);
  if (state.unlocks.restaurant) drawCounterShelf(590, 204, 'steak', state.counters.steak, cLim);

  drawMachine(-122, -35, '🪚', 'sawmill');
  drawMachine(122, -35, '🪑', 'workshop');
  drawMachine(492, -45, '🔥', 'grill');

  // Ground dropped items
  groundItems.forEach(gi => {
    const yOff = Math.sin(gi.bob) * 3;
    ctx.font = '20px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const ic = gi.item === 'wood' ? '🪵' : gi.item === 'plank' ? '🪚' : gi.item === 'furn' ? '🪑' : '🥩';
    ctx.fillText(ic, gi.x, gi.y + yOff);
  });

  // --- ENTITIES (Y-Sorted) ---
  const renderList = [];

  trees.forEach(t => renderList.push({ y: t.y, fn: () => drawTree(t) }));
  animals.forEach(a => renderList.push({ y: a.y, fn: () => drawAnimal(a) }));

  customers.forEach(c => {
    renderList.push({
      y: c.y,
      fn: () => {
        drawCharacter(c.x, c.y, c.color, 'none', 'none', c.walk, 0, 1);
        if (c.state !== 'leaving') {
          const ic = c.item === 'wood' ? '🪵' : c.item === 'plank' ? '🪚' : c.item === 'furn' ? '🪑' : '🍖';
          drawOutlinedText(`${ic}×${c.want}`, c.x, c.y - 44, 13, '#fff');
        }
      }
    });
  });

  workers.forEach(w => {
    renderList.push({
      y: w.y,
      fn: () => {
        const shirt = w.role === 'lumberjack' ? '#f59e0b' : w.role === 'carrier' ? '#a855f7' : w.role === 'cashier' ? '#3b82f6' : w.role === 'hunter' ? '#10b981' : '#e11d48';
        const hat = w.role === 'hunter' ? 'cowboy' : 'beanie';
        let stack = [];
        if (w.role === 'lumberjack') stack = Array(w.bag || 0).fill('wood');
        else if (w.role === 'hunter') stack = Array(w.bag || 0).fill('rawMeat');
        else if (w.role === 'carrier' && w.carryAmt > 0) {
          const t = w.carryItem === 'plank_to_work' ? 'plank' : w.carryItem;
          stack = Array(w.carryAmt).fill(t);
        }
        drawCharacter(w.x, w.y, shirt, hat, w.role === 'carrier' || w.role === 'cashier' || w.role === 'waiter' ? 'none' : 'steel', w.walk || 0, w.swing || 0, w.facing || 1, stack);
      }
    });
  });

  const pStack = [];
  for (let i = 0; i < state.bag.wood; i++) pStack.push('wood');
  for (let i = 0; i < state.bag.plank; i++) pStack.push('plank');
  for (let i = 0; i < state.bag.furn; i++) pStack.push('furn');
  for (let i = 0; i < state.bag.rawMeat; i++) pStack.push('rawMeat');
  for (let i = 0; i < state.bag.steak; i++) pStack.push('steak');

  renderList.push({
    y: player.y,
    fn: () => {
      drawCharacter(player.x, player.y, state.style.shirt, state.style.hat, state.style.axeStyle, player.walkAnim, player.swingAnim, player.facing, pStack);
    }
  });

  renderList.sort((a, b) => a.y - b.y);
  renderList.forEach(r => r.fn());

  particles.forEach(p => {
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  });

  floaters.forEach(f => {
    ctx.save();
    ctx.globalAlpha = Math.max(0, f.life);
    drawOutlinedText(f.text, f.x, f.y, 15, f.color);
    ctx.restore();
  });

  ctx.restore();

  if (joy.active) {
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.28)';
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(joy.startX, joy.startY, 50, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.beginPath();
    ctx.arc(joy.startX + joy.dx * 50, joy.startY + joy.dy * 50, 20, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function loop(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

updateHUD();
requestAnimationFrame(loop);
</script>
</body>
</html>
